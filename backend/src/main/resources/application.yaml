spring:
  application:
    name: livraria-online
  profiles:
    default: local
  flyway:
    locations: classpath:db/migration

app:
  outbox:
    polling-delay-ms: ${OUTBOX_POLLING_DELAY_MS:5000}
    batch-size: ${OUTBOX_BATCH_SIZE:20}
    max-attempts: ${OUTBOX_MAX_ATTEMPTS:3}

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

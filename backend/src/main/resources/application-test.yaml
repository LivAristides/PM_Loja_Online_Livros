spring:
  task:
    scheduling:
      enabled: false
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:livraria}
    username: ${DB_USERNAME:livraria_app}
    password: ${DB_PASSWORD:change-me-local-only}

app:
  storage:
    covers-path: ${COVER_STORAGE_PATH:/tmp/livraria-covers}
